<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">AI Color Harmony pipeline</title>
  <desc id="desc">Input image, scene classification and AI diagnostics, parameter fusion, manual image correction, and output preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f1e9"/>
      <stop offset="1" stop-color="#e7e6de"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4975b"/>
      <stop offset="1" stop-color="#cb6646"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="19" flood-color="#102a30" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1440" height="820" fill="url(#bg)"/>
  <circle cx="1260" cy="100" r="310" fill="#d9ddd3" opacity=".5"/>
  <circle cx="80" cy="760" r="270" fill="#efdbca" opacity=".6"/>
  <text x="92" y="112" fill="#b65e3e" font-family="Avenir Next, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5">DIGITAL IMAGE PROCESSING / TEAM 05</text>
  <text x="88" y="184" fill="#173841" font-family="Avenir Next, Helvetica, sans-serif" font-size="68" font-weight="800">AI Color Harmony</text>
  <text x="92" y="228" fill="#53656a" font-family="Avenir Next, Helvetica, sans-serif" font-size="23">AI estimates the adjustments. A manual pipeline applies every pixel-level edit.</text>
  <g filter="url(#shadow)" font-family="Avenir Next, Helvetica, sans-serif">
    <rect x="90" y="330" width="230" height="250" rx="24" fill="#fffdf7"/>
    <rect x="350" y="330" width="260" height="250" rx="24" fill="#173841"/>
    <rect x="640" y="330" width="230" height="250" rx="24" fill="url(#accent)"/>
    <rect x="900" y="330" width="260" height="250" rx="24" fill="#173841"/>
    <rect x="1190" y="330" width="160" height="250" rx="24" fill="#fffdf7"/>
    <text x="118" y="392" fill="#b65e3e" font-size="20" font-weight="700">01 / INPUT</text>
    <text x="118" y="452" fill="#173841" font-size="32" font-weight="700">Image</text>
    <text x="118" y="500" fill="#53656a" font-size="19">OpenCV I/O</text>
    <text x="118" y="528" fill="#53656a" font-size="19">Histogram</text>
    <text x="378" y="392" fill="#eab58a" font-size="20" font-weight="700">02 / ANALYZE</text>
    <text x="378" y="452" fill="#fffdf7" font-size="32" font-weight="700">Scene + AI</text>
    <text x="378" y="500" fill="#d2deda" font-size="19">MobileNetV2</text>
    <text x="378" y="528" fill="#d2deda" font-size="19">Diagnostic CNN</text>
    <text x="668" y="392" fill="#fff6ec" font-size="20" font-weight="700">03 / FUSE</text>
    <text x="668" y="452" fill="#fffdf7" font-size="32" font-weight="700">Parameters</text>
    <text x="668" y="500" fill="#fff6ec" font-size="19">Preset + AI</text>
    <text x="668" y="528" fill="#fff6ec" font-size="19">Fusion weight</text>
    <text x="928" y="392" fill="#eab58a" font-size="20" font-weight="700">04 / CORRECT</text>
    <text x="928" y="452" fill="#fffdf7" font-size="32" font-weight="700">Manual DIP</text>
    <text x="928" y="500" fill="#d2deda" font-size="19">WB / Gamma</text>
    <text x="928" y="528" fill="#d2deda" font-size="19">Hue / Saturation</text>
    <text x="1218" y="392" fill="#b65e3e" font-size="20" font-weight="700">05 / OUTPUT</text>
    <text x="1218" y="452" fill="#173841" font-size="31" font-weight="700">Compare</text>
    <text x="1218" y="500" fill="#53656a" font-size="19">Preview</text>
    <text x="1218" y="528" fill="#53656a" font-size="19">Save</text>
  </g>
  <g fill="none" stroke="#bd7153" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M325 455h18m-7-8 8 8-8 8M615 455h18m-7-8 8 8-8 8M875 455h18m-7-8 8 8-8 8M1165 455h18m-7-8 8 8-8 8"/>
  </g>
  <line x1="92" y1="660" x2="1348" y2="660" stroke="#b9bdb3" stroke-width="2"/>
  <text x="92" y="708" fill="#53656a" font-family="Avenir Next, Helvetica, sans-serif" font-size="19">Concept diagram based on the public repository. Input samples are shown separately in the gallery.</text>
</svg>
